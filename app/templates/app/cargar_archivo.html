{% extends 'index.html' %}

{% block content %}
    <h1>Cargar Archivos</h1>

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="file" name="archivo_excel" accept=".xlsx">
            <button type="submit">Cargar Archivo</button>
        </form>

        {% if message %}
        <p>{{ message }}</p>
        {% endif %}
{% endblock %}
