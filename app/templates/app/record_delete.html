{% extends "index.html" %}

{% block content %}
  <h3>Confirmar eliminación</h3>
  <p>¿Estás seguro de que deseas eliminar el registro "{{ record }}"?</p>
  <form method="post" action="{% url 'app:record-delete' record.pk %}">
    {% csrf_token %}
    <button type="submit">Eliminar</button>
  </form>
{% endblock %}
