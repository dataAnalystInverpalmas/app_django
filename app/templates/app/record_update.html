{% extends "index.html" %}

{% block content %}
  <h1>Update Record</h1>
  <form method="post" action="{% url 'app:record-update' record.pk %}">
    {% csrf_token %}
    <!-- Campos del formulario con los valores actuales del registro -->
    {{ form.as_p }}  <!-- Renderizar el formulario como campos de párrafo -->
    <button type="submit">Guardar cambios</button>
  </form>
{% endblock content %}
